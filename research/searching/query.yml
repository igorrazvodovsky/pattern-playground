# --- Status after the 2026-08-27 run (two passes; see the dated notes) ---

answered:
  - >-
    The one-shot model is partial, not wrong. It holds at the lookup pole and
    fails for exploratory search; Palagi et al. reject the dichotomy for a
    continuum and Athukorala et al. measure the blur (85% classifier accuracy on
    core tasks, 60.3% once borderline tasks are included).
  - >-
    The classic anchors (Bates, Kuhlthau, Marchionini, Furnas) are still live in
    current HCI/IR work rather than superseded. Teevan's orienteering and
    Pirolli & Card's information scent produced no claim either way here.
  - >-
    The search/browse hybrid is the best-evidenced design response for
    exploratory tasks, with one specific citable rule (Flamenco: never render a
    zero-result link; preview counts on every result-selecting link) — but
    faceted overviews bias what gets seen toward what the taxonomy covers, by
    structural availability rather than by labelling.
  - >-
    Query-formulation support steers. Position bias in the suggestion list is
    well replicated; the latent-persuasion studies are about writing assistants,
    not search boxes, and no study bridges the gap between five sentences of
    argument and a five-word query.
  - >-
    The practitioner design corpus is verified. Apple HIG and Material Design 3
    converge on a single identified search location and visible scope, and both
    treat suggestion timing as a choice. Morville & Callender's ten patterns and
    Russell-Rose/Lamantia/Makri's nine modes are usable with their provenance
    attached; Tunkelang stays paywalled, so use Hearst §8.6 for a definition of
    faceted search.
  - >-
    Uptake is not effect. Exactly one recovery move in the pre-AI corpus has a
    measured outcome against a control (Anick's Prisma bucket test) and it was
    null on result clicks; every other figure — 6%, 8.4%, 18.5%, 35.7% — is a
    usage rate.

open:
  - >-
    No source in either pass reports a query-level zero-result rate, in any
    setting. Baymard's ~50% scores sites, not queries; NN/g's 35%/62% is
    zero-click, not zero-result. Nothing measures behaviour conditional on
    landing on a zero-result page.
  - >-
    The searching / filtering / prompting boundary is dissolved by the theory
    rather than drawn: Radlinski & Craswell file fielded search under critique
    and put the plain search box inside their conversational grid, and their
    item-valued model does not extend to generated answers. The one empirical
    source (Mayerhofer et al., CHIIR '25) ran a two-box interface, so it cannot
    say how actors behave with a single input surface.
  - >-
    Generative search and human behaviour. Citation quality is measured once, in
    early 2023, on four products since renamed. Exploration narrowing is
    measured in one lab study on contested political topics over a closed
    corpus, and does not transfer to product, code, docs or file search.
  - >-
    Whether query autocomplete helps or harms on balance. White & Marchionini
    point one way on 2007-era term expansion, Liu & Bagrow the other on speed,
    Smith et al. suggest the benefit concentrates at session entry, and Niu &
    Hemminger's catalogue logs are confounded by a year of other change. No
    systematic search of the QAC literature has been done — Cai & de Rijke's
    survey chapter on presentation and interaction was not consulted, so the
    defensible statement is "not searched", not "no study exists".
