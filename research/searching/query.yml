story: apps/patterns/src/content/patterns/searching.mdx
topic: searching as a seeking move — query formulation, result sets, and the
  shift from retrieval to generated answers
interaction: |
  An actor wants something out of a collection they cannot or will not walk
  through by hand. They express intent as a query — keywords, a natural-language
  request, a command — and the system does the evaluation and discrimination,
  returning an ordered set (or, increasingly, a composed answer) rather than the
  collection's own structure.
context: |
  Any surface holding more content than an actor can browse: applications with
  global and in-context search, document and file systems, catalogues, and
  now generative search and assistant surfaces where the query is answered
  rather than matched. Thin pattern in the library — descriptive anatomy, no
  forces, no solution statement, a commented-out decision tree. Neighbours are
  navigation-overview, filtering, autocomplete, suggestion, command-menu,
  prompt, data-view.
questions:
  - Does the one-shot "query in, result set out" model survive the evidence, or
    is seeking iterative and evolving (berrypicking, orienteering, foraging) —
    and if so what is the invariant move the pattern should state?
  - When does search beat browsing and when does it lose? What does the evidence
    say about search-dominant vs browse-dominant behaviour, about search
    requiring vocabulary the actor may not have, and about navigation's role in
    teaching the search space?
  - What is the real cost of query formulation, and does support for it
    (autocomplete, query suggestion, scaffolds, examples) help or anchor the
    actor onto worse queries?
  - What happens at failure — zero results, wrong results, the actor not
    recognising a good result? What recovery moves are evidenced?
  - What changes when the system answers instead of retrieving (conversational
    and generative search)? Effects on query behaviour, exploration, trust,
    verification, and on the result set as an object at all.
  - Where is the boundary between searching and its neighbours — filtering
    (refine a set) and prompting (instruct or generate) — given that AI search
    translates a query into filters and command bars accept both?
  - Does scope (global vs local, search-within-results) belong to this pattern
    or is it a separate move?
keywords:
