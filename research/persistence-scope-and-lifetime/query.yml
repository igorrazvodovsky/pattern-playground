story: null
topic: persistence as a cross-cutting design dimension — what state is attached to (session, actor, object, record) and how long it survives (ephemeral, session-scoped, durable)
interaction: |
  An actor works, leaves, and comes back. Between those moments some state
  survives and some does not: the half-typed message, the parked exchange, the
  committed document, the remembered preference, the log entry. Designers decide,
  per surface, what is kept, what it is attached to, how long it lasts, and
  whether the actor meets that decision at all.
context: |
  A pattern language for interaction design, with a focus on human-AI
  collaboration. Persistence currently has no node: its forces are distributed
  across `saving` (the storage necessity and the human acts riding on it),
  `draft-and-publish` (the ready-for-others boundary), `disengage-without-closing`
  (parking an exchange), `selective-memory` and `ai-tuning` (two channels of
  actor-scoped memory), `undo` and `deletion` (removal and its remains),
  `provenance-marking` (write-time capture), `activity-log` (the record),
  `shareability` (what a link carries, and what deliberately does not), and the
  `memory-and-continuity` sequence that walks all of it. The `temporality`
  quality mentions persistence once, filed under Duration. The project's own
  decision-dimension inventory names the absence: "no branch reasons about
  whether state is ephemeral, session-scoped, or durable."
  NOTE ON SCOPE: this run is about persistence as a cross-cutting axis. The
  actor-scoped AI-memory channel was already gated at research/selective-memory/
  (2026-08-25) and is deliberately not re-run here; findings there are inputs.
questions:
  - Is persistence one design territory or several? Does the thing state is
    attached to — a session, an actor, an object, a record — determine how the
    move is designed, or do the four share forces that would justify treating
    them as one?
  - Does the lifetime axis (ephemeral, session-scoped, durable) branch design
    decisions in the literature, or is it an implementation fact the actor never
    meets? Where lifetime is designed deliberately, what drives the choice?
  - What is known about resumption specifically — returning to interrupted or
    parked work, across a break or across devices? Is resuming a distinct move
    from remembering, with its own forces, or the reading half of the same one?
  - What do actors believe survives? Is there evidence on folk models of storage
    — what people expect to still be there, where those expectations break, and
    what the interface owes them when it stores silently or waits for them?
  - Does the save/commit boundary carry human meaning beyond storage? What
    evidence bears on autosave versus manual save versus staged draft-and-publish,
    and on what is lost when the explicit step is removed?
  - Which disciplines already own a taxonomy of this word — session management
    and state scope in systems and web architecture, task resumption in HCI,
    archival appraisal and retention in records management — and where do their
    vocabularies collide with an interaction-design reading?
