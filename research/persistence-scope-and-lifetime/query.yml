# --- Status after the 2026-08-31 run
# NOTE: questions were drafted from session analysis and presented to the author,
# but the run proceeded before an answer arrived. Not user-reviewed.
# answered:
#   Q1 (partly) — the attachment point is itself the design decision; Bardram's
#     activity construct and Card & Henderson's Rooms are a fifth candidate that
#     dissolves session/object/actor rather than joining them. The four-way scope
#     split in this file's context is an unexamined assumption, not a finding.
#   Q3 — resumption carries obligations storage does not (awareness cues over
#     distributed state; adaptation to the resuming device). What is restored is
#     not required to be what was stored.
#   Q4 — benign neglect is the folk model and it fails for digital things
#     (Marshall 2008); distribution across stores and forgotten locations are two
#     of the four named challenges.
#   Q5 — practice sets the default in the opposite direction from saving.mdx for
#     forms (Primer); the surviving explicit step names a version, not storage.
# open:
#   Q2 — lifetime-as-a-feature is under-evidenced. Only the ephemeral-messaging
#     case was found, single study, affective outcomes. Would be answered by the
#     disappearing-content and retention-UX literature, and by a direct survey of
#     incognito/ephemeral modes that this run did not do.
#   Q6 — barely touched. Archival appraisal (Cook W1592250567) resolved but
#     carries no abstract or references in OpenAlex and was not read. Would be
#     answered by a named-canon read of appraisal theory and of session
#     management in systems architecture.
#   Cloud-era folk models — Marshall & Tang "That syncing feeling" and Odom
#     "Lost in translation" failed to resolve on reconstructed titles. A refresh
#     should chase both; they are the evidence Q4 wants and this run lacks.

