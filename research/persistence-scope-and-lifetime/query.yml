# now answered:
#   Q2 — designed lifetime is a developed territory with a canon (Bannon;
#     Mayer-Schoenberger's Delete; Geambasu's Vanish) and a six-practice taxonomy
#     (Ankenbauer & Brewer 2025: pure, performative, temporal, spatial,
#     visualized, unintentional). The field is sceptical of pure forgetting;
#     built practices are graded — salience reduction, lifecycle demotion,
#     obfuscation, visible decay.
#   Q6 (partly) — information lifecycle management is the neighbouring
#     discipline, reached from the HCI side and explicitly likened to records
#     retention. Archival appraisal theory still unread.
# newly open:
