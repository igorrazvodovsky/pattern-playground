story: plans/active/2026-08-world-regrounding.md
topic: mock world as individuals, facts, and a replayed action log
interaction: |
  Demos and stories read a shared fictional world; authors extend it by
  authoring typed actions, from which facts (state) are generated by replay.
context: |
  Design-research repository; mock data only, no runtime system. Small scale
  (tens of individuals, hundreds of actions). Facts as {relation, subject,
  object} triples; large rich-content values inline; declarative when/then
  reactions over a flat, concept-free action vocabulary.
questions:
  - Which event-sourcing scars (replay-derived state, event schema evolution,
    events-as-facts vs events-as-intents, snapshots) apply at mock-data scale?
  - Does flat {relation, subject, object} hold up against EAV/triple-store
    practice on cardinality, retraction, and blob-valued attributes?
  - Are action partitions (concepts) organisational or structural — what
    breaks in a rule/reaction system without them?
  - Is there precedent for fixture/mock data modeled as event logs rather
    than entity snapshots?
keywords: [event sourcing, EAV, triple store, concept design, conceptual model, action log, provenance, replay]

