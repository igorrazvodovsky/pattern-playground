# The language arranged by levels of scale
# (plans/active/2026-10-pattern-facets.md). Three parts, each with its own way
# of making: centres that no single act of making finishes, centres made in one
# go, and points that repeat on every surface without adding up to a larger
# centre. The first two follow A Pattern Language's division between towns and
# buildings. Each design pattern is placed once, where most of its forces
# operate; a need that recurs at several sizes stays one pattern with a variant
# for each size. In the second part, a `section` names the kind of work that
# neighbouring groups share. Within a group, wholes come before the parts that
# complete them, and the build warns when a part sits above a whole it helps
# complete. Read in order, the leads should give an overview of the language; a
# lead that strains marks a boundary to move.

- id: whole
  order: 1
  title: The whole
  lead: >-
    Centres that no single act of making finishes. Many surfaces, features and
    acts add to each one or pass through it, and what they add makes one
    centre: an address space, a record, a vocabulary, a set of rules. Each is
    adopted for the whole artifact or one of its divisions, built into each
    surface as it is made, and revisited as the whole is checked.
  groups:
    - title: Setting
      lead: >-
        Place the artifact among the tools its actors already use, give it one
        logic across its surfaces and the channels it is reached through, keep
        the work on the actor's device where it can be, and reach for what else
        is the actor's only as they allow.
      patterns:
        - tool-ecology
        - information-environment
        - cross-channel-continuity
        - local-first-ownership
        - permissions
    - title: Workspaces and who is let in
      lead: >-
        Divide the work into workspaces, ask for identity only as each need
        calls for it, let in the agents actors bring under grants of their own,
        draw the lines of who answers for which part of the work, decide who is
        let into each workspace and what each participant may do
        there, show who can do what once access comes from several places,
        and let the people inside coordinate their work.
      patterns:
        - workspace
        - identity-at-the-point-of-need
        - outside-agent
        - division-of-responsibility
        - sharing
        - roles
        - effective-access
        - collaboration
    - title: Connecting and naming
      lead: >-
        Connect the divisions so that anything can be reached from anywhere: an
        address for every state, search across all of it, a way for actors to
        say what they want in their own words, ways back to what the actor
        opened recently or chose to keep, links found across the content, and
        labels and structure that grow from use.
      patterns:
        - deep-linking
        - searching
        - addressable-in-words
        - recents
        - bookmarking
        - dynamic-hyperlinks
        - tag
        - incremental-formalisation
    - title: When stuck
      lead: >-
        Leave no actor stuck: help they can reach from any point, and a route
        to the person who can act where the artifact cannot.
      patterns:
        - help
        - reaching-a-person
    - title: Learning the whole
      lead: >-
        Make the whole learnable over time: a reduced set of functions to start
        from, routes past the interface for those who use it daily, commands by
        name and then by key, capabilities shown where they become usable, and
        changes introduced without breaking what actors already know.
      patterns:
        - layered-interface
        - mastery
        - command-menu
        - keyboard-shortcuts
        - feature-discovery
    - title: Records
      lead: >-
        Keep a record that every act adds to: what happened and who did it, a
        feed of what arrives, and who or what made each contribution.
      patterns:
        - activity-log
        - activity-feed
        - attribution
    - title: Rules every act passes through
      lead: >-
        Set the rules every act and event passes through: how much protection
        each action gets, the history that lets an act be taken back, how
        urgent each kind of event is and where it goes, the defaults the actor
        can retune, and the arrangements kept between visits.
      patterns:
        - action-consequences
        - undo
        - status-feedback
        - notification
        - settings
        - remembered-state
    - title: Work done without the actor
      lead: >-
        Wherever work is done without the actor, set what holds across every
        run: the agent that does it, the authority it is granted, the instructions and memory it carries, how what it
        produces is treated, and the procedures handed over to run.
      patterns:
        - agent
        - bounded-autonomy
        - standing-instructions
        - memory
        - generated-content
        - workflow

- id: divisions-and-surfaces
  order: 2
  title: Divisions and surfaces
  lead: >-
    Centres made in one go. First a division's layout, its entrance and its
    accounts, then each surface, taken by the kind of work it is for:
    collections, changes, shared work and work with an agent.
  groups:
    - title: Laying out a division
      section: Divisions
      lead: >-
        Within each division, choose how the actor moves between its sections
        from the kind of space it is, and recombine the models as the division
        grows.
      patterns:
        - multilevel-tree
        - fully-connected
        - hub-and-spoke
        - flat-navigation
        - pyramid
        - step-by-step
        - pan-and-zoom
        - hybrid-patterns
    - title: The entrance
      section: Divisions
      lead: >-
        Give the artifact an entrance: admit the actor without demanding
        identity, onboard the newcomer to a result they came for early and show
        the route onward, explain what is already there to someone joining a
        space in use, and give each empty place a first step, a starting shape
        or an example to take apart.
      patterns:
        - immediate-use
        - onboarding
        - charted-progress
        - joining-work-in-progress
        - state-empty
        - template
        - starter-example
    - title: Accounts
      section: Divisions
      lead: >-
        Where identity is needed, establish accounts predictably: by password,
        without one, or through an identity the actor already holds, with a way
        back in when access is lost.
      patterns:
        - account-access
        - password
        - account-recovery
        - passwordless-access
        - federated-identity
    - title: Framing a collection
      section: Collections
      lead: >-
        Where a division holds a collection, frame it for the actor's purpose in
        one view or several, at a scale that keeps it readable, and show each
        entity at the detail its moment needs.
      patterns:
        - overview-detail
        - coordinated-views
        - data-view
        - purpose-keyed-view
        - problem-curated-view
        - semantic-zoom
        - focus-and-context
        - text-lens
        - item-view
    - title: Shaping a view
      section: Collections
      lead: >-
        On each view, let the actor choose its attributes, order and grouping,
        narrow it by criteria or by rules they compose, and compare items.
      patterns:
        - attribute-visibility
        - sorting
        - grouping
        - filtering
        - rule-composition
        - comparing
    - title: Acting on items
      section: Collections
      lead: >-
        Let the actor select what to act on, find the actions for it right
        there, and carry items to where they belong.
      patterns:
        - selection
        - contextual-actions
        - drag-and-drop
    - title: Where a change is made
      section: Changes
      lead: >-
        Decide for each kind of change where it is made, in a wizard, a form, a
        block document or in place, and how a long change is reviewed and
        resumed.
      patterns:
        - wizard
        - resuming
        - form
        - review-before-submitting
        - block-based-editor
        - editing-in-place
    - title: Storing and removing
      section: Changes
      lead: >-
        Decide when changes are stored, published and kept as versions, how
        they sync through storage the actor holds, how work is copied in from
        and out to other tools, how a rule or a bulk change is tried before it
        counts, and how things are removed.
      patterns:
        - saving
        - draft-and-publish
        - version-history
        - sync-through-own-storage
        - import-and-export
        - trial-run
        - deletion
    - title: Working on the same thing
      lead: >-
        Where people work on the same thing, show who is there, let them mark
        and discuss it in place, review and merge what diverged, and pass work
        on with its context.
      patterns:
        - presence
        - annotation
        - commenting
        - change-review
        - reconciliation
        - handoff
    - title: Help inside the work
      section: Work with an agent
      lead: >-
        Let the system offer help inside the work, from a suggestion to the
        whole next step, raised or lowered on the evidence of use.
      patterns:
        - assisted-task-completion
        - next-best-action
        - suggestion
    - title: Conversation
      section: Work with an agent
      lead: >-
        Where the actor talks with an agent, bound each exchange or run one that
        keeps nothing, open it from either side, and say what the agent can do.
      patterns:
        - session
        - ephemeral-session
        - conversation
        - agent-opening
        - user-opening
        - capability-and-scope
    - title: Carrying a request
      section: Work with an agent
      lead: >-
        Carry each kind of request through the exchange: questions from either
        side, open requests, long answers, and controls placed in the exchange.
      patterns:
        - inquiry-user
        - open-request
        - inquiry-agent
        - extended-telling
        - inline-interface
    - title: Trouble and endings
      section: Work with an agent
      lead: >-
        Repair the exchange when understanding breaks, fork it when trying an
        alternative from an earlier turn, and end or park it deliberately.
      patterns:
        - agent-repair
        - user-repair
        - branching
        - abort
        - sequence-completion
        - closing
        - disengage-without-closing
    - title: Handing work over
      section: Work with an agent
      lead: >-
        Where the actor hands work to an agent, let them state it or pass on a
        task a control could not finish, ground it in their own material and in
        what they have in view, lay the instructions
        beside the work, and see how it was read, the plan and the cost.
      patterns:
        - prompt
        - prompt-scaffolding
        - reference-material
        - view-as-context
        - agent-fallback
        - steering-surface
        - showing-the-reading
        - plan-preview
        - cost-transparency
    - title: Following and receiving work
      section: Work with an agent
      lead: >-
        Show the work while it runs and what is left of it, stop it at
        consequential points, and let
        the actor place, revise or redraw what comes back, whole or in part.
      patterns:
        - live-presentation
        - transparent-reasoning
        - working-plan
        - approval-gate
        - extraction
        - instructed-revision
        - regeneration
    - title: Correcting standing behaviour
      section: Work with an agent
      lead: >-
        Where the system acts under rules or learned preferences, let the
        actor correct it at the case it got wrong, and let them show what
        they cannot say.
      patterns:
        - case-correction
        - tuning-by-demonstration
    - title: Checking machine output
      section: Work with an agent
      lead: >-
        Mark machine involvement where output mixes or travels, give its claims
        evidence the actor can check, and make accepting it take a moment of
        judgement where the stakes call for it.
      patterns:
        - provenance-marking
        - citation
        - expressed-uncertainty
        - explanation
        - cognitive-forcing-functions
        - overreliance-checklist
        - human-goes-first

- id: finishing
  order: 3
  title: Finishing
  lead: >-
    Points that complete a surface, such as a field, a control, a state or a
    message. Each recurs on every surface and stays a point where it is: what
    the surfaces share is a convention for it, not a larger centre.
  groups:
    - title: Fields and values
      lead: >-
        Shape each field: how the value is entered, how written text is given
        structure, what it is chosen from, what is filled in or offered as the
        actor types, and how a wrong value is reported.
      patterns:
        - forgiving-format
        - structured-format
        - prestructured-formatting
        - bounded-choice
        - good-defaults
        - autofill
        - autocomplete
        - ai-completion
        - validation
    - title: Disclosure
      lead: >-
        Disclose what a surface holds as it is needed: step by step, in
        sections, and in previews of what a link leads to.
      patterns:
        - progressive-disclosure
        - sections
        - link-preview
    - title: States and messages
      lead: >-
        Mark the wait while a request runs, give every surface its unavailable
        states, confirm destructive acts in place, and report outcomes in
        messages that pass.
      patterns:
        - waiting
        - state-disabled
        - unavailable-actions
        - inline-confirmation
        - transient-feedback
